<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f8fb"><meta name="description" content="Save and organize property locations on a map."><title>HomeMap — Places</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#14202b;background:#f4f6f8;font-synthesis:none;--blue:#087cf0;--muted:#75818d;--line:#e4e9ee;--shadow:0 10px 32px #1c2a381c}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{height:100dvh;display:flex;flex-direction:column}.map-area{position:relative;flex:1;min-height:0;background:#e8edf1}#map{position:absolute;inset:0;z-index:1}.leaflet-control-attribution{font-size:10px!important}.searchbar{position:absolute;z-index:500;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 28px));height:54px;background:#fff;border-radius:17px;box-shadow:var(--shadow);display:flex;align-items:center;padding:0 14px;gap:10px}.search-icon{font-size:20px;color:#75818d}.searchbar input{border:0;outline:0;flex:1;min-width:0;font-size:16px}.searchbar button{border:0;background:none;color:var(--blue);font-weight:650;padding:8px}.controls{position:absolute;z-index:450;top:82px;right:max(14px,env(safe-area-inset-right));display:grid;gap:9px}.round{width:46px;height:46px;background:#fff;border:0;border-radius:50%;box-shadow:var(--shadow);font-size:21px;color:#253542;display:grid;place-items:center}.round.active{background:var(--blue);color:white}.round.small{height:40px;width:40px}.hint{position:absolute;z-index:400;top:84px;left:50%;transform:translateX(-50%);background:#fff;border-radius:20px;padding:9px 15px;box-shadow:var(--shadow);font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none}.layer-menu{position:absolute;z-index:450;right:68px;top:83px;background:white;padding:6px;border-radius:13px;box-shadow:var(--shadow);display:none}.layer-menu.open{display:flex;gap:5px}.layer-menu button{border:0;border-radius:9px;background:transparent;padding:9px 12px;color:#354451}.layer-menu button.selected{background:#e8f3ff;color:var(--blue);font-weight:650}.zoom-controls{position:absolute;z-index:450;left:14px;bottom:18px;display:grid;gap:8px}.zoom-controls .round{font-size:23px}.bottom-nav{z-index:600;background:#fff;border-top:1px solid var(--line);padding:8px 18px max(8px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:min(15vw,120px)}.nav-btn{min-width:74px;border:0;background:transparent;color:#7b8792;display:grid;justify-items:center;gap:3px;padding:2px 8px;font-size:11px;font-weight:600}.nav-btn .ico{font-size:21px;line-height:1.1}.nav-btn.selected{color:var(--blue)}.status{position:absolute;z-index:550;top:145px;left:50%;transform:translateX(-50%);max-width:calc(100% - 28px);padding:10px 14px;border-radius:12px;background:#fff4dc;color:#654900;box-shadow:var(--shadow);font-size:13px;display:none}.status.show{display:flex;align-items:center;gap:12px}.status button{border:0;background:none;color:var(--blue);font-weight:700}.sheet{position:absolute;z-index:700;inset:0 0 0 auto;width:min(420px,100%);background:#fff;box-shadow:-12px 0 35px #192a3818;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .23s ease}.sheet.open{transform:translateX(0)}.sheet-head{padding:20px 20px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.sheet-head h2{margin:0;font-size:19px}.close{border:0;background:#f0f3f5;border-radius:50%;height:34px;width:34px;font-size:20px;color:#52606b}.sheet-body{padding:16px 20px;overflow:auto;flex:1}.sheet-body label{display:block;font-size:11px;font-weight:750;letter-spacing:.08em;color:#65727e;margin:17px 0 7px}.field{width:100%;border:1px solid #dce3e9;border-radius:11px;background:white;padding:12px;color:#17232e;outline-color:var(--blue)}textarea.field{min-height:96px;resize:vertical}.colors{display:flex;gap:11px;flex-wrap:wrap}.color-choice{border:2px solid transparent;width:33px;height:33px;border-radius:50%;padding:0;position:relative}.color-choice.selected{outline:2px solid #17232e;outline-offset:2px}.save{width:100%;border:0;border-radius:12px;padding:13px;background:var(--blue);color:white;font-weight:700;margin-top:20px}.save:disabled{opacity:.5}.places-list{display:grid;gap:9px}.place{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--line);border-radius:13px}.place-pin{width:12px;height:12px;border-radius:50%;flex:none}.place-info{min-width:0;flex:1;cursor:pointer}.place-info strong,.place-info span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.place-info strong{font-size:14px}.place-info span{font-size:12px;color:var(--muted);margin-top:3px}.place-actions{display:flex;gap:5px}.place-actions button{border:0;background:#f1f4f6;border-radius:8px;padding:7px;color:#54616c}.empty{color:var(--muted);font-size:14px;line-height:1.5}.backup-actions{display:grid;gap:10px}.backup-actions button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:13px;text-align:left;font-weight:650;color:#24313c}.backup-actions button span{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:3px}.leaflet-popup-content-wrapper{border-radius:12px}.leaflet-popup-content{font-family:inherit}.pin-marker{width:31px;height:39px;position:relative}.pin-marker svg{filter:drop-shadow(0 2px 3px #0004)}@media(max-width:600px){.sheet{inset:auto 0 0;width:100%;height:min(75dvh,650px);border-radius:22px 22px 0 0;transform:translateY(105%);box-shadow:0 -12px 35px #192a3818}.sheet.open{transform:translateY(0)}.sheet-head{padding-top:16px}.hint{top:78px;font-size:12px}.controls{top:76px}.layer-menu{top:77px}.status{top:130px}}
</style></head>
<body><div class="app"><main class="map-area"><div id="map" aria-label="Map of saved properties"></div>
<div class="searchbar"><span class="search-icon" aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search an address or place" autocomplete="street-address" aria-label="Search an address or place"><button id="searchBtn" type="button">Search</button></div>
<div id="hint" class="hint">Tap +, then tap a house to save it</div><div class="controls"><button id="addBtn" class="round" type="button" aria-label="Add property" title="Add property">＋</button><button id="layersBtn" class="round" type="button" aria-label="Choose map layer" title="Map layers">◫</button><button id="locateBtn" class="round" type="button" aria-label="Show my location" title="My location">◎</button></div>
<div id="layerMenu" class="layer-menu"><button data-layer="street" class="selected" type="button">Street</button><button data-layer="satellite" type="button">Satellite</button></div><div class="zoom-controls"><button id="zoomIn" class="round small" type="button" aria-label="Zoom in">＋</button><button id="zoomOut" class="round small" type="button" aria-label="Zoom out">−</button></div>
<div id="status" class="status" role="status"><span id="statusText">Map loading…</span><button id="retry" type="button">Retry</button></div>
<aside id="sheet" class="sheet" aria-label="HomeMap panel"><div class="sheet-head"><h2 id="sheetTitle">Places</h2><button id="closeSheet" class="close" type="button" aria-label="Close">×</button></div><div id="sheetBody" class="sheet-body"></div></aside></main>
<nav class="bottom-nav" aria-label="Main navigation"><button class="nav-btn selected" data-view="map" type="button"><span class="ico">⌖</span>Map</button><button class="nav-btn" data-view="places" type="button"><span class="ico">⌖</span>Places</button><button class="nav-btn" data-view="backup" type="button"><span class="ico">⇧</span>Backup</button></nav></div>
<input id="backupFile" type="file" accept="application/json,.json" hidden>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(()=>{'use strict';const KEY='homemap-properties-v3';const colors={Blue:'#087cf0',Green:'#20a464',Yellow:'#e7b422',Red:'#e54e4e',Purple:'#8b5bd6',Gray:'#84909b'};let properties=load(),map=null,layer=null,markers=null,layerKind='street',placing=false,chosenColor='Blue',editingId=null,pendingPoint=null;const $=id=>document.getElementById(id);function load(){try{const p=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(p)?p.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&Number.isFinite(+x.lat)&&Number.isFinite(+x.lng)):[]}catch{return []}}function persist(){try{localStorage.setItem(KEY,JSON.stringify(properties));return true}catch{alert('Could not save your places. Browser storage may be full or disabled. Export a backup and free some storage.');return false}}function status(msg){$('statusText').textContent=msg;$('status').classList.add('show')}function clearStatus(){$('status').classList.remove('show')}function tile(kind){return L.tileLayer(kind==='satellite'?'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}':'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:kind==='satellite'?'Tiles © Esri':'© OpenStreetMap contributors'})}function init(){if(!window.L){status('Map library did not load. Check your connection.');return}try{if(!map){map=L.map('map',{zoomControl:false}).setView([39.5,-98.35],4);markers=L.layerGroup().addTo(map);map.on('click',e=>{if(placing){pendingPoint=e.latlng;openEditor(null,e.latlng)}});map.on('tileerror',()=>status('Map tiles could not load. Check your connection or change layers.'));map.on('tileload',clearStatus)}if(layer)map.removeLayer(layer);layer=tile(layerKind).addTo(map);layer.on('tileerror',()=>status('Map tiles could not load. Check your connection or change layers.'));layer.on('tileload',clearStatus);drawPins();setTimeout(()=>map.invalidateSize(),150)}catch{status('Map could not start. Tap Retry to try again.')}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function drawPins(){if(!markers)return;markers.clearLayers();properties.forEach(p=>{const icon=L.divIcon({className:'',html:`<div class="pin-marker"><svg width="31" height="39" viewBox="0 0 31 39" aria-hidden="true"><path d="M15.5 1C7.5 1 1 7.4 1 15.3c0 10.1 14.5 22.1 14.5 22.1S30 25.4 30 15.3C30 7.4 23.5 1 15.5 1z" fill="${colors[p.color]||colors.Blue}" stroke="white" stroke-width="2"/><circle cx="15.5" cy="15" r="5" fill="white"/></svg></div>`,iconSize:[31,39],iconAnchor:[15,38],popupAnchor:[0,-35]});const m=L.marker([p.lat,p.lng],{icon}).addTo(markers);m.bindPopup(`<strong>${esc(p.name)}</strong><br>${esc(p.category||'Other')}`);m.on('click',()=>{placing=false;$('addBtn').classList.remove('active')})})}function openSheet(title,html){$('sheetTitle').textContent=title;$('sheetBody').innerHTML=html;$('sheet').classList.add('open')}function closeSheet(){$('sheet').classList.remove('open')}function openEditor(item,point){editingId=item?.id||null;pendingPoint=point||item&&{lat:item.lat,lng:item.lng};chosenColor=item?.color||'Blue';const cats=['Prospect','Contacted','Estimate','Customer','Follow-up','Other'];openSheet(item?'Edit property':'New property',`<form id="propertyForm"><p class="empty">${item?'Update the details for this property.':'Tap the map to place a pin'}${pendingPoint?`<br><small>${pendingPoint.lat.toFixed(5)}, ${pendingPoint.lng.toFixed(5)}</small>`:''}</p><label for="propName">PROPERTY NAME</label><input id="propName" class="field" maxlength="120" placeholder="e.g. 12 Oak Street" required value="${esc(item?.name||'')}"><label for="category">CATEGORY</label><select id="category" class="field">${cats.map(c=>`<option ${item?.category===c?'selected':''}>${c}</option>`).join('')}</select><label>PIN COLOR</label><div class="colors">${Object.entries(colors).map(([name,color])=>`<button type="button" class="color-choice ${chosenColor===name?'selected':''}" data-color="${name}" aria-label="${name}" title="${name}" style="background:${color}"></button>`).join('')}</div><label for="notes">PROPERTY NOTES</label><textarea id="notes" class="field" maxlength="4000" placeholder="Add notes…">${esc(item?.notes||'')}</textarea><button class="save" type="submit">${item?'Save changes':'Save property'}</button></form>`);document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{chosenColor=b.dataset.color;document.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('selected',x===b))});$('propertyForm').onsubmit=e=>{e.preventDefault();if(!pendingPoint){alert('Tap +, then tap the map to place a pin first.');return}const p={id:editingId||`${Date.now()}-${Math.random().toString(36).slice(2)}`,name:$('propName').value.trim(),category:$('category').value,color:chosenColor,notes:$('notes').value.trim(),lat:pendingPoint.lat,lng:pendingPoint.lng,updatedAt:new Date().toISOString()};if(editingId)properties=properties.map(x=>x.id===editingId?p:x);else properties.push(p);if(persist()){placing=false;editingId=null;$('addBtn').classList.remove('active');closeSheet();drawPins()}}}function showPlaces(){const rows=properties.slice().sort((a,b)=>a.name.localeCompare(b.name));openSheet('Places',rows.length?`<div class="places-list">${rows.map(p=>`<div class="place"><span class="place-pin" style="background:${colors[p.color]||colors.Blue}"></span><div class="place-info" data-open="${esc(p.id)}"><strong>${esc(p.name)}</strong><span>${esc(p.category||'Other')} · ${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}</span></div><div class="place-actions"><button type="button" data-edit="${esc(p.id)}" aria-label="Edit ${esc(p.name)}">Edit</button><button type="button" data-delete="${esc(p.id)}" aria-label="Delete ${esc(p.name)}">×</button></div></div>`).join('')}</div>`:'<p class="empty">No saved properties yet. Tap +, then tap a house on the map to add one.</p>');document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{const p=properties.find(x=>x.id===el.dataset.open);if(p){closeSheet();map.setView([p.lat,p.lng],16);markers.eachLayer(m=>{if(m.getLatLng().lat===p.lat&&m.getLatLng().lng===p.lng)m.openPopup()})}});document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>{const p=properties.find(x=>x.id===el.dataset.edit);if(p)openEditor(p)});document.querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>{const p=properties.find(x=>x.id===el.dataset.delete);if(p&&confirm(`Delete “${p.name}”?`)){properties=properties.filter(x=>x.id!==p.id);persist();drawPins();showPlaces()}})}function showBackup(){openSheet('Backup',`<p class="empty">Keep a backup of your properties. Data is stored only in this browser on this device and does not sync to an account.</p><div class="backup-actions"><button id="exportBtn" type="button">⇩ Export backup<span>Download your saved places as a JSON file.</span></button><button id="importBtn" type="button">⇧ Import backup<span>Restore or merge places from a HomeMap JSON backup.</span></button></div><p class="empty">${properties.length} saved ${properties.length===1?'property':'properties'}</p>`);$('exportBtn').onclick=exportData;$('importBtn').onclick=()=>$('backupFile').click()}function exportData(){const blob=new Blob([JSON.stringify({app:'HomeMap',version:3,exportedAt:new Date().toISOString(),properties},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`homemap-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url)}function setView(view){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('selected',b.dataset.view===view));if(view==='places')showPlaces();else if(view==='backup')showBackup();else closeSheet()}$('addBtn').onclick=()=>{placing=!placing;$('addBtn').classList.toggle('active',placing);if(placing){closeSheet();$('hint').textContent='Tap the map to place a pin';}else $('hint').textContent='Tap +, then tap a house to save it'};$('layersBtn').onclick=()=>$('layerMenu').classList.toggle('open');document.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{layerKind=b.dataset.layer;document.querySelectorAll('[data-layer]').forEach(x=>x.classList.toggle('selected',x===b));$('layerMenu').classList.remove('open');init()});$('locateBtn').onclick=()=>{if(!navigator.geolocation){alert('Location is not available in this browser.');return}navigator.geolocation.getCurrentPosition(pos=>map.setView([pos.coords.latitude,pos.coords.longitude],15),()=>alert('Could not get your location. Check browser location permissions.'))};$('zoomIn').onclick=()=>map&&map.zoomIn();$('zoomOut').onclick=()=>map&&map.zoomOut();$('closeSheet').onclick=closeSheet;document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('retry').onclick=init;async function search(){const q=$('search').value.trim();if(!q)return;$('searchBtn').textContent='…';try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q=${encodeURIComponent(q)}`,{headers:{Accept:'application/json'}});if(!r.ok)throw Error();const results=await r.json();if(!results.length){alert('No results found. Try a more specific address.');return}let result=results[0];if(results.length>1){const chosen=prompt('Choose a result by number:\n'+results.map((x,i)=>`${i+1}. ${x.display_name}`).join('\n'));const n=Number(chosen)-1;if(!Number.isInteger(n)||!results[n])return;result=results[n]}map.setView([+result.lat,+result.lon],16);$('search').value=result.display_name}catch{alert('Address search failed. Check your internet connection and try again.')}finally{$('searchBtn').textContent='Search'}}$('searchBtn').onclick=search;$('search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();search()}};$('backupFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text()),incoming=Array.isArray(data)?data:data.properties;if(!Array.isArray(incoming)||incoming.some(p=>!p||typeof p.name!=='string'||!Number.isFinite(+p.lat)||!Number.isFinite(+p.lng)))throw Error();if(!confirm(`Import ${incoming.length} properties? Matching IDs will be replaced.`))return;const byId=new Map(properties.map(p=>[p.id,p]));incoming.forEach(p=>{const id=typeof p.id==='string'?p.id:`${Date.now()}-${Math.random()}`;byId.set(id,{id,name:p.name.slice(0,120),category:catsafe(p.category),color:colors[p.color]?p.color:'Blue',notes:typeof p.notes==='string'?p.notes.slice(0,4000):'',lat:+p.lat,lng:+p.lng,updatedAt:p.updatedAt||new Date().toISOString()})});properties=[...byId.values()];if(persist()){drawPins();showBackup();alert('Backup imported.')}}catch{alert('Could not import this file. Select a valid HomeMap JSON backup.')}finally{e.target.value=''}};function catsafe(v){return ['Prospect','Contacted','Estimate','Customer','Follow-up','Other'].includes(v)?v:'Other'}
// Import older HomeMap address-based backups too.
const previous=(()=>{try{return JSON.parse(localStorage.getItem('homemap-properties-v1')||'[]')}catch{return []}})();if(!properties.length&&Array.isArray(previous)&&previous.length){properties=previous.filter(p=>p&&Number.isFinite(+p.lat)&&Number.isFinite(+p.lng)).map(p=>({id:p.id||`${Date.now()}-${Math.random()}`,name:p.address||'Saved property',category:'Other',color:'Blue',notes:p.notes||'',lat:+p.lat,lng:+p.lng,updatedAt:p.updatedAt||new Date().toISOString()}));persist()}init();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));})();
</script></body></html>
