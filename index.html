<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f7f8fa"><title>HomeMap</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--ink:#17202b;--muted:#687381;--blue:#087cf0;--glass:rgba(255,255,255,.94);--shadow:0 8px 28px rgba(18,32,48,.16)}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#e9edf1}#map{position:absolute;inset:0;z-index:1}.leaflet-container{font:inherit}.topbar{position:absolute;z-index:500;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;gap:9px;align-items:center}.search-wrap{flex:1;display:flex;align-items:center;gap:9px;background:var(--glass);backdrop-filter:blur(18px);border-radius:16px;padding:0 13px;height:48px;box-shadow:var(--shadow)}.search-wrap span{font-size:20px;color:#5b6570}#search{border:0;outline:0;background:transparent;width:100%;font-size:16px;min-width:0}.circle-btn,.tool-btn{border:0;background:var(--glass);backdrop-filter:blur(18px);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:#263545}.circle-btn{width:46px;height:46px;border-radius:15px;font-size:25px}.map-tools{position:absolute;z-index:450;right:14px;top:calc(max(12px,env(safe-area-inset-top)) + 62px);display:flex;flex-direction:column;gap:9px}.tool-btn{width:44px;height:44px;border-radius:14px;font-size:20px}.tool-btn.active{color:var(--blue)}.bottom-area{position:absolute;z-index:500;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;pointer-events:none;display:flex;flex-direction:column;gap:10px}.hint{align-self:center;background:#1c2733d9;color:white;border-radius:20px;padding:8px 13px;font-size:12px;pointer-events:auto}.bottom-nav{pointer-events:auto;background:var(--glass);backdrop-filter:blur(22px);border-radius:19px;box-shadow:var(--shadow);display:flex;justify-content:space-around;padding:8px 4px}.nav-btn{border:0;background:transparent;color:#66717e;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;min-width:58px;padding:3px 8px}.nav-btn b{font-size:21px;font-weight:400}.nav-btn.selected{color:var(--blue);font-weight:650}.sheet-backdrop{position:absolute;inset:0;z-index:600;background:#0a141e2e;display:none}.sheet-backdrop.show{display:block}.sheet{position:absolute;z-index:610;left:0;right:0;bottom:0;max-height:84%;background:#fafbfdF7;backdrop-filter:blur(25px);border-radius:24px 24px 0 0;box-shadow:0 -12px 40px #101e2d33;transform:translateY(105%);transition:transform .28s;overflow:auto;padding:9px 18px calc(20px + env(safe-area-inset-bottom))}.sheet.open{transform:translateY(0)}.grabber{height:5px;width:38px;border-radius:5px;background:#c8cdd3;margin:2px auto 15px}.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.sheet h2{font-size:22px;margin:0 0 4px}.subtle{font-size:13px;color:var(--muted)}.close{border:0;background:#e9edf1;border-radius:50%;width:31px;height:31px;font-size:20px}.field{margin-top:14px}.field label{display:block;font-size:12px;color:#65717e;font-weight:650;margin:0 0 6px}.field input,.field textarea,.field select{width:100%;border:1px solid #1926341f;border-radius:12px;padding:12px 13px;font:inherit;font-size:15px;background:white}.field textarea{min-height:100px;resize:vertical}.row{display:flex;gap:10px}.row>.field{flex:1;min-width:0}.actions{display:flex;gap:9px;margin-top:17px}.primary,.secondary,.danger{border:0;border-radius:13px;padding:12px 15px;font-size:14px;font-weight:650}.primary{background:var(--blue);color:white;flex:1}.secondary{background:#e9eef4;color:#263545}.pin-dot{width:25px;height:25px;border:3px solid white;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 8px #0005;position:relative}.pin-dot:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:white;top:6px;left:6px}.search-results{position:absolute;z-index:520;top:calc(max(12px,env(safe-area-inset-top)) + 56px);left:14px;right:68px;background:white;border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:none}.result{padding:12px 14px;border-bottom:1px solid #edf0f2;font-size:14px;cursor:pointer}.result small{display:block;color:var(--muted);margin-top:3px}.empty{padding:16px;color:var(--muted);font-size:14px}.toast{position:absolute;z-index:900;top:80px;left:50%;transform:translateX(-50%);background:#17202b;color:white;padding:9px 14px;border-radius:20px;font-size:13px;display:none;white-space:nowrap}

/* Clean Apple Maps-inspired visual refresh */
:root{--ink:#202832;--muted:#7b8490;--blue:#087cf0;--glass:rgba(255,255,255,.94);--shadow:0 3px 16px rgba(25,38,52,.13)}
html,body{background:#eef1f4;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;letter-spacing:-.15px}
#map{background:#e8edf0}
.topbar{top:max(12px,env(safe-area-inset-top));left:12px;right:12px;gap:8px}
.search-wrap{height:50px;border-radius:26px;padding:0 16px;gap:10px;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.9);box-shadow:0 3px 18px rgba(25,38,52,.14)}
.search-wrap span{font-size:22px;color:#7b8490}
#search{font-size:16px;font-weight:400;letter-spacing:-.2px}
#search::placeholder{color:#8b939c}
.circle-btn{height:50px;width:50px;border-radius:50%;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.9);box-shadow:0 3px 18px rgba(25,38,52,.14);font-size:25px;font-weight:300;color:var(--blue)}
.map-tools{right:13px;top:calc(max(12px,env(safe-area-inset-top)) + 65px);gap:10px}
.tool-btn{width:43px;height:43px;border-radius:50%;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.85);box-shadow:0 3px 14px rgba(25,38,52,.13);font-size:19px;color:#46515d}
.tool-btn.active{background:#eaf3ff;color:var(--blue)}
.bottom-area{bottom:max(13px,env(safe-area-inset-bottom));left:12px;right:12px;gap:8px}
.hint{background:rgba(35,45,57,.82);border-radius:18px;padding:7px 12px;font-size:11px;font-weight:500;box-shadow:0 2px 8px #0002}
.bottom-nav{border-radius:24px;padding:7px 6px;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 22px rgba(25,38,52,.16);justify-content:space-around}
.nav-btn{color:#77818c;font-size:10px;font-weight:500;gap:2px;min-width:65px;padding:4px 12px}
.nav-btn b{font-size:21px;line-height:22px}
.nav-btn.selected{color:var(--blue);font-weight:650}
.sheet{background:rgba(250,251,253,.985);border-radius:27px 27px 0 0;padding:8px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -8px 35px rgba(20,35,50,.17)}
.grabber{width:36px;height:5px;background:#d2d6db;margin:3px auto 18px}
.sheet h2{font-size:23px;font-weight:700;letter-spacing:-.65px}
.subtle{font-size:13px;color:#7b8490;line-height:1.35}
.close{background:#eef0f3;color:#6f7882;font-size:20px;width:30px;height:30px}
.field{margin-top:16px}
.field label{font-size:10px;letter-spacing:.7px;color:#8a929b;font-weight:700;margin-bottom:7px}
.field input,.field textarea,.field select{border:1px solid #e4e7eb;border-radius:13px;padding:13px 14px;font-size:15px;background:#fff;box-shadow:0 1px 2px rgba(20,30,40,.025)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#8fc3ff;outline:3px solid rgba(8,124,240,.09)}
.field textarea{min-height:110px;line-height:1.4}
.primary{border-radius:14px;background:#087cf0;padding:14px 16px;font-size:15px;box-shadow:0 3px 8px rgba(8,124,240,.18)}
.secondary{border-radius:14px;background:#edf0f3;color:#394552;padding:14px 16px}
.pin-dot{width:24px;height:24px;border-width:3px;box-shadow:0 2px 7px rgba(0,0,0,.3)}
.search-results{top:calc(max(12px,env(safe-area-inset-top)) + 60px);left:12px;right:70px;border-radius:17px;box-shadow:0 6px 24px rgba(25,38,52,.16)}
.result{padding:13px 15px;font-size:14px}
.result small{font-size:11px;color:#89929b}
.toast{top:82px;border-radius:20px;padding:9px 15px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
@media(min-width:700px){.topbar{left:18px}.bottom-area{width:400px}.sheet{border-radius:27px}}

</style></head><body><div id="map"></div><div class="topbar"><div class="search-wrap"><span>⌕</span><input id="search" autocomplete="off" placeholder="Search Maps"></div><button class="circle-btn" id="addBtn" title="Add a pin">＋</button></div><div class="search-results" id="searchResults"></div><div class="map-tools"><button class="tool-btn" id="layerBtn" title="Map style">◫</button><button class="tool-btn" id="locateBtn" title="My location">◎</button><button class="tool-btn" id="zoomIn">＋</button><button class="tool-btn" id="zoomOut">−</button></div><div class="bottom-area"><div class="hint" id="hint">Tap +, then tap a house to save it</div><div class="bottom-nav"><button class="nav-btn selected" id="mapTab"><b>⌖</b>Map</button><button class="nav-btn" id="savedTab"><b>⌖</b>Places</button><button class="nav-btn" id="backupTab"><b>⇧</b>Backup</button></div></div><div class="sheet-backdrop" id="backdrop"></div><section class="sheet" id="sheet"><div class="grabber"></div><div class="sheet-head"><div><h2 id="sheetTitle">New property</h2><div class="subtle" id="sheetAddress">Tap the map to place a pin</div></div><button class="close" id="closeSheet">×</button></div><div class="field"><label>PROPERTY NAME</label><input id="propertyName" placeholder="House, customer, or street name"></div><div class="row"><div class="field"><label>CATEGORY</label><select id="category"><option>Prospect</option><option>Contacted</option><option>Estimate</option><option>Customer</option><option>Follow-up</option><option>Other</option></select></div><div class="field"><label>PIN COLOR</label><select id="pinColor"><option value="#087cf0">Blue</option><option value="#27a66b">Green</option><option value="#f2a900">Yellow</option><option value="#e34b43">Red</option><option value="#9256cf">Purple</option><option value="#344454">Gray</option></select></div></div><div class="field"><label>PROPERTY NOTES</label><textarea id="notes" placeholder="Roof condition, contact details, work needed, follow-up date, or anything to remember..."></textarea></div><div class="actions"><button class="primary" id="savePin">Save property</button><button class="secondary" id="deletePin" style="display:none">Delete</button></div></section><div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(()=>{const $=id=>document.getElementById(id);const map=L.map('map',{zoomControl:false}).setView([33.0362,-97.3881],14);const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}),sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'});street.addTo(map);let satellite=false,pins=JSON.parse(localStorage.getItem('homemap_pins_v3')||'[]'),markers={},editing=null,draft=null,addMode=false;
const icon=c=>L.divIcon({className:'',html:`<div class="pin-dot" style="background:${c}"></div>`,iconSize:[28,34],iconAnchor:[14,30]});const save=()=>localStorage.setItem('homemap_pins_v3',JSON.stringify(pins));const toast=t=>{$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)};
function render(){Object.values(markers).forEach(m=>map.removeLayer(m));markers={};pins.forEach(p=>{let m=L.marker([p.lat,p.lng],{icon:icon(p.color||'#087cf0')}).addTo(map);m.on('click',()=>edit(p.id));markers[p.id]=m})}
function show(){$('backdrop').classList.add('show');$('sheet').classList.add('open')}function hide(){$('backdrop').classList.remove('show');$('sheet').classList.remove('open');editing=null}
function edit(id){let p=pins.find(x=>x.id===id);if(!p)return;editing=id;draft={lat:p.lat,lng:p.lng};$('sheetTitle').textContent='Property details';$('sheetAddress').textContent=p.address||`${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`;$('propertyName').value=p.name||'';$('category').value=p.category||'Prospect';$('pinColor').value=p.color||'#087cf0';$('notes').value=p.notes||'';$('savePin').textContent='Save changes';$('deletePin').style.display='block';show()}
function fresh(ll,address=''){editing=null;draft=ll;$('sheetTitle').textContent='New property';$('sheetAddress').textContent=address||`${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`;$('propertyName').value='';$('category').value='Prospect';$('pinColor').value='#087cf0';$('notes').value='';$('savePin').textContent='Save property';$('deletePin').style.display='none';show()}
map.on('click',e=>{if(addMode){fresh(e.latlng);addMode=false;$('hint').textContent='Tap +, then tap a house to save it'}else $('hint').textContent='Tap + to add a pin, or tap a saved pin to edit'});$('addBtn').onclick=()=>{addMode=true;$('hint').textContent='Tap the map where the house is located';toast('Tap the map to place your pin')};
$('savePin').onclick=()=>{if(!draft)return;let p={id:editing||'p'+Date.now(),lat:draft.lat,lng:draft.lng,name:$('propertyName').value.trim()||'Saved property',category:$('category').value,color:$('pinColor').value,notes:$('notes').value.trim(),address:$('sheetAddress').textContent};if(editing){let i=pins.findIndex(x=>x.id===editing);if(i>=0)pins[i]=p}else pins.push(p);save();render();hide();toast('Property saved on this device')};
$('deletePin').onclick=()=>{if(!editing||!confirm('Delete this property and its notes?'))return;pins=pins.filter(p=>p.id!==editing);save();render();hide();toast('Property deleted')};$('closeSheet').onclick=hide;$('backdrop').onclick=hide;
$('layerBtn').onclick=()=>{if(satellite){map.removeLayer(sat);street.addTo(map);$('layerBtn').classList.remove('active')}else{map.removeLayer(street);sat.addTo(map);$('layerBtn').classList.add('active')}satellite=!satellite};$('zoomIn').onclick=()=>map.zoomIn();$('zoomOut').onclick=()=>map.zoomOut();$('locateBtn').onclick=()=>{if(!navigator.geolocation)return toast('Location unavailable');navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],17),()=>toast('Could not get your location'))};
async function search(q){let box=$('searchResults');box.innerHTML='<div class="empty">Searching…</div>';box.style.display='block';try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q='+encodeURIComponent(q)),d=await r.json();box.innerHTML='';if(!d.length){box.innerHTML='<div class="empty">No results found</div>';return}d.forEach(x=>{let el=document.createElement('div');el.className='result';el.textContent=x.name||x.display_name;let sm=document.createElement('small');sm.textContent=x.display_name;el.appendChild(sm);el.onclick=()=>{let ll={lat:+x.lat,lng:+x.lon};map.setView([ll.lat,ll.lng],18);box.style.display='none';$('search').value=x.name||x.display_name;fresh(ll,x.display_name)};box.appendChild(el)})}catch(e){box.innerHTML='<div class="empty">Search needs an internet connection.</div>'}}
let timer;$('search').oninput=()=>{clearTimeout(timer);let q=$('search').value.trim();if(q.length<3){$('searchResults').style.display='none';return}timer=setTimeout(()=>search(q),500)};document.addEventListener('click',e=>{if(!e.target.closest('.topbar')&&!e.target.closest('.search-results'))$('searchResults').style.display='none'});
$('savedTab').onclick=()=>{if(!pins.length)return toast('No saved properties yet');let v=prompt('Saved properties:\n'+pins.map((p,i)=>`${i+1}. ${p.name} — ${p.category}`).join('\n')+'\n\nEnter a number to open one:');let n=Number(v)-1;if(Number.isInteger(n)&&pins[n]){map.setView([pins[n].lat,pins[n].lng],18);edit(pins[n].id)}};$('mapTab').onclick=()=>{};$('backupTab').onclick=()=>{let v=prompt('Backup options:\n1 = Export backup\n2 = Import backup');if(v==='1'){let b=new Blob([JSON.stringify({app:'HomeMap',version:3,pins},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='homemap-backup.json';a.click();URL.revokeObjectURL(a.href)}if(v==='2')$('importFile').click()};
let input=document.createElement('input');input.type='file';input.accept='application/json';input.style.display='none';input.id='importFile';document.body.appendChild(input);input.onchange=async()=>{try{let d=JSON.parse(await input.files[0].text());if(!Array.isArray(d.pins))throw 0;if(!confirm(`Import ${d.pins.length} properties? This replaces properties saved on this device.`))return;pins=d.pins;save();render();toast('Backup imported')}catch(e){alert('Could not read that backup file.')}input.value=''};render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
